<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strength &amp; Honor</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Strength &amp; Honor">
<meta name="theme-color" content="#14120e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#14120e; --card:#1f1c17; --card2:#1b1814; --ink:#f2ede3; --muted:#a69d8c; --line:#2f2a21; --line2:#2a251d;
  --brand:#d4a94e; --brand-soft:#2a2418; --on-brand:#14120e; --warn:#ff8a5c; --danger:#ff8a8a;
  --kcal:#b8f04a; --p:#4cc9f0; --c:#ffb547; --f:#ff7a96;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;color-scheme:dark}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
a{color:var(--brand)}
.hidden{display:none!important}
.cz{font-family:Cinzel,Georgia,serif;font-weight:700}
.kicker{font-family:Cinzel,Georgia,serif;font-size:12px;letter-spacing:3px;color:var(--brand)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto}
header.top h1{font-family:Cinzel,Georgia,serif;font-size:26px;margin:0;font-weight:700}
.head-btns{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icon-btn svg{width:18px;height:18px}
main{padding:0 16px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.card h2{font-family:Cinzel,Georgia,serif;font-size:18px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer}
.btn.secondary{background:var(--brand-soft);color:var(--brand);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);padding:8px 10px}
.btn.outline{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:#341b1b;color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
label.f{display:block;margin:0 0 10px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input::placeholder{color:#7d7464}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
/* plovoucí lišta */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;width:calc(100% - 32px);max-width:560px;height:64px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
nav.tabs button{width:48px;height:48px;border-radius:14px;border:1px solid transparent;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.active{border-color:var(--brand);color:var(--brand)}
nav.tabs button.fab{width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--on-brand);box-shadow:0 4px 16px rgba(0,0,0,.5)}
nav.tabs button.fab svg{width:26px;height:26px}
/* souhrn dne */
.rings-wrap{display:flex;align-items:center;gap:18px;padding:4px 4px 10px}
.rings-wrap svg{flex:none}
.rvals{display:flex;flex-direction:column;gap:10px;min-width:0}
.rvals .lbl{font-size:12px;color:var(--muted)}
.rvals .v{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:20px;white-space:nowrap}
.rvals .v.big{font-size:26px}
.rvals .v small{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tile.over{background:#2a1a12;border-color:var(--warn)}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .v{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:22px}
.tile .v small{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 8px}
.sec-head h3{font-family:Cinzel,Georgia,serif;font-size:18px;margin:0}
/* jídla */
.meal-card{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.meal-top{display:flex;align-items:center;gap:12px}
.meal-ic{width:40px;height:40px;border-radius:12px;border:1px solid #3a3328;display:flex;align-items:center;justify-content:center;flex:none}
.meal-ic svg{width:20px;height:20px}
.meal-name{font-weight:600}
.kc{font-family:Cinzel,Georgia,serif;font-weight:700;white-space:nowrap}
.kc small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.mac{display:flex;gap:10px;font-size:12px;color:#d8d0c2;flex-wrap:wrap}
.mac b.p{color:var(--p)} .mac b.c{color:var(--c)} .mac b.f{color:var(--f)}
.meal-empty{display:flex;align-items:center;gap:12px;width:100%;border:1.5px dashed #3a3328;background:none;color:var(--muted);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left}
.meal-actions{display:flex;gap:8px;margin-top:8px}
.meal-actions button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--brand);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.meal-actions svg{width:16px;height:16px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer}
.entry .n{font-size:14px}
.entry .k{font-weight:600;white-space:nowrap;font-size:14px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line2);cursor:pointer}
.list-item:first-child{border-top:0}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid #3a3328;color:var(--muted);margin-left:4px;vertical-align:middle}
/* oblíbená a zopakovat */
.repeat-card{border:1px solid var(--brand);background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.fav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line2);margin-bottom:8px}
.fav .add{width:44px;height:36px;border-radius:10px;border:1px solid var(--brand);background:none;color:var(--brand);display:flex;align-items:center;justify-content:center;cursor:pointer}
.label-caps{font-size:12px;letter-spacing:2px;color:var(--muted);margin:14px 4px 8px}
.meal-pick{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.meal-pick button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer}
.meal-pick button.on{border-color:var(--brand);color:var(--brand);font-weight:600}
/* míry */
.mgroup{font-size:11px;letter-spacing:2px;color:var(--brand);padding:12px 0 4px}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.mrow .n{flex:1;font-size:14px}
.mrow .d{width:46px;text-align:right;font-size:12px;font-weight:600}
.cm-in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px}
.cm-in input{border:0!important;background:none!important;padding:12px 0!important;font-weight:600;outline:none}
.cm-in span{font-size:13px;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-top:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sheet-head h2{margin:0;font-size:22px;font-family:Cinzel,Georgia,serif}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:220px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;cursor:pointer}
.result{background:var(--brand-soft);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#2e2920;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
.login h1{font-family:Cinzel,Georgia,serif}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.spark{width:100%;height:90px;display:block}
/* volba způsobu přidání */
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.choice b{display:block;font-size:16px;margin-bottom:3px}
.choice span{font-size:13px;color:var(--muted)}
/* průvodce kamerou */
.cam{position:relative;width:100%;height:36vh;min-height:220px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam.scan{height:auto;min-height:0} .cam.scan .camMsg{position:static;padding:6px 0;background:#000}
.cam .frame{position:absolute;border:3px solid var(--brand);border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.42);transition:all .2s}
.cam .camMsg{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.wz-steps{display:flex;gap:4px;margin:2px 0 10px}
.wz-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wz-steps i.done{background:var(--kcal)} .wz-steps i.cur{background:var(--brand)}
.wz-read{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wz-read input{font-size:22px;font-weight:700;text-align:center}
.wz-read .unit{font-weight:600;color:var(--muted);min-width:36px}
.wz-sum{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>
<body>

<!-- Přihlášení -->
<section id="loginView" class="login hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1 style="text-align:center;margin:0 0 18px">Strength &amp; Honor</h1>
  <div class="card">
    <form id="loginForm">
      <label class="f"><span>E-mail</span><input type="email" id="loginEmail" autocomplete="username" required></label>
      <label class="f"><span>Heslo</span><input type="password" id="loginPass" autocomplete="current-password" required></label>
      <button class="btn block" type="submit">Přihlásit se</button>
      <p id="loginErr" class="small" style="color:var(--danger)"></p>
    </form>
  </div>
  <p class="muted small" style="text-align:center">Účet ti založí správce aplikace.</p>
</section>

<!-- Aplikace -->
<div id="appView" class="hidden">
  <header class="top">
    <div><div class="kicker">STRENGTH &amp; HONOR</div><h1 id="title">Dnes</h1></div>
    <div class="head-btns" id="headBtns"></div>
  </header>
  <main>
    <section id="tab-today"></section>
    <section id="tab-foods" class="hidden"></section>
    <section id="tab-training" class="hidden"></section>
    <section id="tab-account" class="hidden"></section>
  </main>
  <nav class="tabs">
    <button data-tab="today" class="active" aria-label="Jídelníček"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button data-tab="foods" aria-label="Potraviny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="fab" id="fab" aria-label="Přidat jídlo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="training" aria-label="Trénink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg></button>
    <button data-tab="account" aria-label="Účet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </nav>
</div>

<div id="modalRoot"></div>

<script>
// ---------- Nastavení ----------
const SUPABASE_URL = 'https://eavfbgcilbevavnqsyck.supabase.co';
const SUPABASE_KEY = 'sb_publishable__tuMwwpcvxypJ1esVEZkDw_Kaf-73qz'; // veřejný klíč, data chrání Row Level Security
const sb = window.__MOCK_SB__ || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MEALS = [
  ['breakfast','Snídaně'], ['snack1','Dopolední svačina'], ['lunch','Oběd'],
  ['snack2','Odpolední svačina'], ['dinner','Večeře']
];
const ACTIVITY = [
  [1.2,'Sedavý (kancelář, bez sportu)'], [1.375,'Lehce aktivní (1–3 tréninky týdně)'],
  [1.55,'Středně aktivní (3–5 tréninků týdně)'], [1.725,'Velmi aktivní (6–7 tréninků týdně)'],
  [1.9,'Extrémně aktivní (fyzická práce + trénink)']
];
const GOALS = [['lose','Hubnutí (−15 %)'], ['maintain','Udržení váhy'], ['gain','Nabírání (+10 %)']];

const S = { user:null, profile:null, foods:[], entries:[], weights:[], recentIds:[], favorites:[], meas:[], date:todayISO(), tab:'today' };

// ---------- Pomocné funkce ----------
function todayISO(){ return toISO(new Date()); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function fmtDate(iso){
  const t=todayISO();
  if(iso===t) return 'Dnes';
  if(iso===addDays(t,-1)) return 'Včera';
  if(iso===addDays(t,1)) return 'Zítra';
  return new Date(iso+'T12:00:00').toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'});
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const r0 = n => Math.round(Number(n)||0);
const r1 = n => Math.round((Number(n)||0)*10)/10;
const num = v => { if(v===''||v==null) return null; const n=Number(String(v).replace(',','.')); return isNaN(n)?null:n; };
const $ = (sel,root=document) => root.querySelector(sel);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function fail(error, what){ console.error(error); toast((what||'Chyba')+': '+(error.message||error)); }

// ---------- Výpočet cíle ----------
function ageFrom(birth){ if(!birth) return null; const b=new Date(birth), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a; }
function latestWeight(){ return S.weights.length ? Number(S.weights[0].weight_kg) : null; }
function computeTargets(p, weight){
  const age=ageFrom(p.birth_date), h=Number(p.height_cm);
  if(!p.sex||!age||!h||!weight) return null;
  const bmr = 10*weight + 6.25*h - 5*age + (p.sex==='m'?5:-161);    // Mifflin–St Jeor
  const tdee = bmr * Number(p.activity_level||1.375);
  const factor = p.goal==='lose'?0.85 : p.goal==='gain'?1.10 : 1;
  const kcal = Math.round(tdee*factor/10)*10;
  const protein = Math.round(weight*(p.goal==='lose'?2.0:1.8));
  const fat = Math.round(kcal*0.25/9);
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
  return { bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, protein, carbs, fat };
}
function targets(){
  const p=S.profile||{};
  return { kcal:p.kcal_target||0, protein:p.protein_target||0, carbs:p.carbs_target||0, fat:p.fat_target||0 };
}

// ---------- Načítání dat ----------
async function loadProfile(){
  let { data, error } = await sb.from('profiles').select('*').eq('user_id', S.user.id).maybeSingle();
  if(error) return fail(error,'Profil');
  if(!data){
    const ins = await sb.from('profiles').insert({ user_id:S.user.id, display_name:(S.user.email||'').split('@')[0] }).select().single();
    if(ins.error) return fail(ins.error,'Profil');
    data = ins.data;
  }
  S.profile = data;
}
async function loadFoods(){
  const { data, error } = await sb.from('foods').select('*').order('name').limit(5000);
  if(error) return fail(error,'Potraviny');
  S.foods = data||[];
}
async function loadEntries(){
  const { data, error } = await sb.from('meal_entries').select('*').eq('date', S.date).order('created_at');
  if(error) return fail(error,'Záznamy');
  S.entries = data||[];
}
async function loadWeights(){
  const { data, error } = await sb.from('weight_log').select('*').order('date',{ascending:false}).limit(120);
  if(error) return fail(error,'Váha');
  S.weights = data||[];
}
async function loadFavorites(){
  const { data, error } = await sb.from('favorite_meals').select('*').order('name');
  if(error) return fail(error,'Oblíbená jídla');
  S.favorites = data||[];
}
async function loadMeasurements(){
  const { data, error } = await sb.from('body_measurements').select('*').order('date',{ascending:false}).limit(200);
  if(error) return fail(error,'Míry');
  S.meas = data||[];
}
async function loadRecent(){
  const { data, error } = await sb.from('meal_entries').select('food_id,created_at').order('created_at',{ascending:false}).limit(300);
  if(error) return;
  const seen=new Set(); S.recentIds=[];
  for(const r of data||[]){ if(r.food_id && !seen.has(r.food_id)){ seen.add(r.food_id); S.recentIds.push(r.food_id); } }
}

// ---------- Přihlášení ----------
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('#loginErr').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email:$('#loginEmail').value.trim(), password:$('#loginPass').value });
  if(error) $('#loginErr').textContent = error.message==='Invalid login credentials' ? 'Špatný e-mail nebo heslo.' : error.message;
});

async function onSession(session){
  if(!session){ S.user=null; $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); return; }
  if(S.user && S.user.id===session.user.id) return;
  S.user = session.user;
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');

// Soustředné kruhy; nad cílem se kruh uzavře a přebytek pokračuje oranžově
function ringsSvg(rings){
  let out='<svg width="164" height="164" viewBox="0 0 164 164" aria-hidden="true"><circle cx="82" cy="82" r="78" fill="none" stroke="#3a3328" stroke-width="1" stroke-dasharray="2 5"/>';
  for(const g of rings){
    const C=2*Math.PI*g.r;
    out+=`<circle cx="82" cy="82" r="${g.r}" fill="none" stroke="#2a251d" stroke-width="12"/>`;
    if(!g.target || !g.val) continue;
    const ratio=g.val/g.target;
    if(ratio<=1){
      out+=`<circle cx="82" cy="82" r="${g.r}" fill="none" stroke="${g.color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-ratio)).toFixed(1)}" transform="rotate(-90 82 82)"/>`;
    } else {
      const ov=Math.min(1, ratio-1)*C;
      out+=`<circle cx="82" cy="82" r="${g.r}" fill="none" stroke="${g.color}" stroke-width="12"/>`;
      out+=`<circle cx="82" cy="82" r="${g.r}" fill="none" stroke="#14120e" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(ov+2).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-89 82 82)"/>`;
      out+=`<circle cx="82" cy="82" r="${g.r}" fill="none" stroke="var(--warn)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${ov.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 82 82)"/>`;
    }
  }
  return out+'</svg>';
}

function foodLine(f){
  return `<div class="list-item" data-food="${f.id}">
    <div><div>${esc(f.name)}${f.source==='off'?'<span class="tag">OFF</span>':''}</div>
    <div class="small muted">${f.brand?esc(f.brand)+' · ':''}B ${r1(f.protein)} · S ${r1(f.carbs)} · T ${r1(f.fat)} / 100 g</div></div>
    <div class="k" style="white-space:nowrap">${r0(f.kcal)} kcal</div></div>`;
}
function searchFoods(q){
  const n=norm(q).trim();
  if(!n){
    const byId=new Map(S.foods.map(f=>[f.id,f]));
    return S.recentIds.map(id=>byId.get(id)).filter(Boolean).slice(0,25);
  }
  const words=n.split(/\s+/);
  return S.foods.filter(f=>{ const h=norm(f.name+' '+(f.brand||'')+' '+(f.barcode||'')); return words.every(w=>h.includes(w)); }).slice(0,50);
}

async function openAddFood(meal, keepQ=''){
  const m=openModal(`<div class="sheet-head"><div><div class="small muted" style="letter-spacing:2px">PŘIDAT DO</div><h2>${mealLabel(meal)}</h2></div><button class="icon-btn" data-close aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <div id="favBox"></div>
    <div class="label-caps">${S.favorites.length?'NEBO JEDNOTLIVĚ':'POTRAVINY'}</div>

    </div>
    <div id="scanArea" class="hidden" style="margin-bottom:10px"><div id="reader"></div></div>
    <div class="card" style="padding:4px 14px"><div class="small muted" id="listHint" style="padding-top:8px"></div><div id="results"></div></div>
    <button class="btn ghost block" id="newFood">+ Nová potravina</button>`);
  const q=$('#q',m), back=f=>openAmount(f, meal);
  const draw=()=>{
    const list=searchFoods(q.value);
    $('#listHint',m).textContent = q.value.trim() ? (list.length?'Výsledky':'Nic nenalezeno – přidej novou potravinu') : (list.length?'Naposledy použité':'Zatím žádné potraviny – vyhledej nebo přidej novou');

    m.querySelectorAll('[data-food]').forEach(r=>r.onclick=()=>back(S.foods.find(f=>String(f.id)===r.dataset.food)));

    $('#favBox',m).innerHTML=`<div class="row between"><div class="label-caps">OBLÍBENÁ JÍDLA</div><button class="btn ghost small" id="favManage">Upravit</button></div>`
      + S.favorites.map(f=>{ const t=sums(f.items); return `<div class="fav">
        <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(f.name)}</div>
          <div class="small muted" style="padding:2px 0 4px">${f.items.map(i=>esc(i.food_name)+' '+fmtNum(i.grams)+' g').join(' · ')}</div>${macLine(t.protein,t.carbs,t.fat)}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${kc(t.kcal)}<button class="add" data-favadd="${f.id}" aria-label="Přidat ${esc(f.name)}">${IC.plus}</button></div></div>`; }).join('');
    m.querySelectorAll('[data-favadd]').forEach(b=>b.onclick=async()=>{
      const f=S.favorites.find(x=>String(x.id)===b.dataset.favadd);
      b.disabled=true; await insertItems(f.items, meal); toast(`${f.name} přidáno do: ${mealLabel(meal)}`);
    });
    $('#favManage',m).onclick=()=>openManageFavorites(meal);

// Vloží položky (oblíbené jídlo nebo včerejší záznamy) do zvoleného jídla a dne
async function insertItems(items, meal){
  const rows=items.map(i=>({ date:S.date, meal, food_id:i.food_id??null, food_name:i.food_name, grams:i.grams, kcal:i.kcal, protein:i.protein, carbs:i.carbs, fat:i.fat }));

  if(error) return fail(error,'Přidání');
  await closeModal(); await Promise.all([loadEntries(), loadRecent()]);
  if(S.tab!=='today') showTab('today'); else renderToday();
}

    </div>

      <button data-g="50">50 g</button><button data-g="100">100 g</button><button data-g="150">150 g</button><button data-g="200">200 g</button>
      ${food.serving_g?`<button data-g="${Number(food.serving_g)}">1 porce (${r1(food.serving_g)} g)</button>`:''}
    </div>
    ${food.serving_g?`<label class="f"><span>Počet kusů / porcí (1 = ${r1(food.serving_g)} g)</span>
      <div class="row">
        <button class="btn secondary" type="button" id="cMinus" style="width:48px">−</button>

      </div></label>`:''}
    <div class="grid2">
      <label class="f"><span>Množství (g)</span><input type="number" id="grams" inputmode="decimal" min="1" step="any" value="${g0}"></label>
      <label class="f"><span>Jídlo</span><select id="meal">${MEALS.map(([k,l])=>`<option value="${k}" ${k===meal?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="result" id="preview"></div>
    <button class="btn block" id="save">${entry?'Uložit změny':'Přidat do jídelníčku'}</button>
    ${entry?'<button class="btn danger block" id="del" style="margin-top:8px">Smazat záznam</button>':''}`);
  const gi=$('#grams',m);
  const calc=()=>{ const g=num(gi.value)||0, k=g/100;
    return { grams:g, kcal:r1(food.kcal*k), protein:r1(food.protein*k), carbs:r1(food.carbs*k), fat:r1(food.fat*k) }; };
  const upd=()=>{ const v=calc(); $('#preview',m).innerHTML=`<b>${r0(v.kcal)} kcal</b> · B ${v.protein} g · S ${v.carbs} g · T ${v.fat} g`; };
  const ci=$('#count',m), sv=Number(food.serving_g)||0;
  const syncCount=()=>{ if(ci) ci.value = r1((num(gi.value)||0)/sv); };
  const setCount=c=>{ c=Math.max(0, Math.round(c*10)/10); ci.value=c; gi.value=r1(c*sv); upd(); };
  gi.oninput=()=>{ syncCount(); upd(); }; syncCount(); upd();
  if(ci){
    ci.oninput=()=>{ const c=num(ci.value); if(c!=null){ gi.value=r1(c*sv); upd(); } };
    $('#cMinus',m).onclick=()=>setCount(Math.ceil((num(ci.value)||0)-1));
    $('#cPlus',m).onclick=()=>setCount(Math.floor((num(ci.value)||0)+1));
  }
  m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ gi.value=b.dataset.g; syncCount(); upd(); });
  $('#save',m).onclick=async()=>{
    const v=calc(); if(!(v.grams>0)) return toast('Zadej množství v gramech');
    const row={ ...v, meal:$('#meal',m).value, food_id:food.id??null, food_name:food.name+(food.brand?' ('+food.brand+')':'') };
    let res;
    if(entry){ if(entry.food_name) row.food_name=entry.food_name; res=await sb.from('meal_entries').update(row).eq('id',entry.id); }
    else res=await sb.from('meal_entries').insert({ ...row, date:S.date });
    if(res.error) return fail(res.error,'Uložení');
    await closeModal(); await Promise.all([loadEntries(), loadRecent()]); if(S.tab!=='today') showTab('today'); else renderToday(); toast(entry?'Uloženo':'Přidáno');
  };
  if(entry) $('#del',m).onclick=async()=>{
    if(!confirm('Smazat tento záznam?')) return;
    const { error }=await sb.from('meal_entries').delete().eq('id',entry.id);
    if(error) return fail(error,'Smazání');
    await closeModal(); await loadEntries(); renderToday();
  };
}

async function startScan(m, onCode){
  const area=$('#scanArea',m);
  if(scanner){ await stopScanner(); area.classList.add('hidden'); return; }
  if(!window.Html5Qrcode){ return manualBarcode(onCode); }
  area.classList.remove('hidden');
  try{
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', { formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E], verbose:false });
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:260, height:140 } }, async code=>{
      await stopScanner(); area.classList.add('hidden'); onCode(code);
    });
  }catch(err){
    await stopScanner(); area.classList.add('hidden');
    toast('Kamera není dostupná – zadej kód ručně'); manualBarcode(onCode);
  }
}
function manualBarcode(onCode){
  const code=prompt('Čárový kód (číslice pod čárami):');
  if(code && /^\d{6,14}$/.test(code.trim())) onCode(code.trim());
}
async function handleBarcode(code, then){
  const own=S.foods.find(f=>f.barcode===code);
  if(own){ toast('Nalezeno ve tvých potravinách'); return then(own); }
  toast('Hledám v Open Food Facts…');
  const off = await lookupOFF(code);
  if(off && off.kcal!==''){ toast('Nalezeno v Open Food Facts – zkontroluj hodnoty'); return openFoodForm(off, then); }
  toast('Kód není v databázi – přidej potravinu');
  chooseNewFood(off || { barcode:code }, then);
}
async function lookupOFF(code){
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_cs,brands,nutriments,serving_quantity`);
    if(!r.ok) return null;
    const j=await r.json(); if(j.status!==1||!j.product) return null;
    const p=j.product, n=p.nutriments||{};
    let kcal=n['energy-kcal_100g']; if(kcal==null && n['energy-kj_100g']!=null) kcal=n['energy-kj_100g']/4.184;
    return { name:(p.product_name_cs||p.product_name||'').trim(), brand:(p.brands||'').split(',')[0].trim(), barcode:code,
      kcal:kcal!=null?r1(kcal):'', protein:n.proteins_100g??'', carbs:n.carbohydrates_100g??'', sugar:n.sugars_100g??'',
      fat:n.fat_100g??'', saturated_fat:n['saturated-fat_100g']??'', fiber:n.fiber_100g??'', salt:n.salt_100g??'', serving_g:p.serving_quantity||'', source:'off' };
  }catch(_){ return null; }
}

let ocrWorker=null, ocrLoading=null;
async function getOcr(){

    if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');

// Převod přečteného textu na číslo pro daný krok
function parseReading(text, key){
  let t = String(text||'').replace(/[|]/g,'/').replace(/\s+/g,' ').trim();
  if(!t) return null;
  const max = key==='kcal' ? 900 : 100;
  if(key==='kcal'){
    t = t.replace(/(\d) (\d{3})(?!\d)/g,'$1$2');                 // "1 520 kJ" -> "1520 kJ"
    const nums=[]; const re=/(\d{1,4}(?:[.,]\d{1,3})?)/g; let m;
    while((m=re.exec(t))) nums.push({ v:parseFloat(m[1].replace(',','.')), end:re.lastIndex });
    if(!nums.length) return null;
    let v=null;
    const k=t.match(/(\d{1,4}(?:[.,]\d)?)\s*k\s*c\s*a?\s*l/i);
    if(k) v=parseFloat(k[1].replace(',','.'));
    if(v==null && nums.length>=2){
      outer: for(let i=0;i<nums.length;i++) for(let j=i+1;j<nums.length;j++){
        const a=nums[i].v, b=nums[j].v; if(!a||!b) continue;
        if(a/b>3.9 && a/b<4.4){ v=b; break outer; }                 // kJ / kcal
        if(b/a>3.9 && b/a<4.4){ v=a; break outer; }
      }
    }
    if(v==null && nums.length===1){
      const after=t.slice(nums[0].end, nums[0].end+3);
      v = /k?J/.test(after) && !/c/i.test(after) ? Math.round(nums[0].v/4.184) : nums[0].v;
    }
    if(v==null) v=nums.find(n=>n.v<=max)?.v ?? null;
    return (v==null||isNaN(v)||v<0||v>max) ? null : Math.round(v);
  }
  // Gramy: první číslo na řádku = sloupec na 100 g.
  // Písmeno „g“ za číslem se občas přečte jako 9, 8 nebo 2 a desetinná čárka se může ztratit.
  const m=t.match(/(\d+(?:\s?[.,]\s?\d+)?)/);
  if(!m) return null;
  let s=m[1].replace(/\s/g,'').replace('.',',');
  let [ip,dp]=s.split(',');
  if(dp!==undefined){
    if(dp.length>=2 && /[289]$/.test(dp) && !(key==='salt' && ip==='0')) dp=dp.slice(0,-1);
    if(dp.length>2) dp=dp.slice(0,2);
  } else {
    if(ip.length>=2 && ip[0]==='0'){ dp=ip.slice(1); ip='0'; }            // "01" -> 0,1
    else if(Number(ip)>max && /[89]$/.test(ip)) ip=ip.slice(0,-1);          // "459" -> 45
    if(Number(ip)>max && ip.length===3){ dp=ip.slice(2); ip=ip.slice(0,2); } // "125" -> 12,5
  }
  const v=parseFloat(ip+(dp?'.'+dp:''));
  if(isNaN(v)||v<0||v>max) return null;
  return Math.round(v*100)/100;
}

  WZ.active=false;
  if(WZ.stream) WZ.stream.getTracks().forEach(t=>t.stop());
  const b=WZ.bc; if(b){ b.stop().catch(()=>{}).finally(()=>{ try{ b.clear(); }catch(_){} }); }
  WZ=null;
}
function wzDiag(t){ if(WZ){ const d=$('#wzDiag',WZ.m); if(d) d.textContent=t; } }
async function wzStopBc(){ if(WZ && WZ.bc){ const b=WZ.bc; WZ.bc=null; try{ await b.stop(); }catch(_){} try{ b.clear(); }catch(_){} } }
function wzStopOwn(){ if(WZ && WZ.stream){ WZ.stream.getTracks().forEach(t=>t.stop()); WZ.stream=null; const v=$('#wzVideo',WZ.m); if(v) v.srcObject=null; } }
// Čárový kód čte stejný živý skener jako tlačítko Sken; čísla čte vlastní kamera s rámečkem
async function wzCamFor(type){
  if(!WZ) return;
  const m=WZ.m, video=$('#wzVideo',m), rd=$('#wzReader',m), fr=$('#wzFrame',m);
  if(type==='barcode'){
    wzStopOwn();
    video.classList.add('hidden'); fr.classList.add('hidden'); rd.classList.remove('hidden'); $('#wzCam',m).classList.add('scan');
    if(WZ.bc) return;
    if(!window.Html5Qrcode){ $('#wzMsg',m).textContent='Skener není dostupný – opiš kód ručně'; return; }
    try{
      const F=Html5QrcodeSupportedFormats;
      const bc=new Html5Qrcode('wzReader',{ formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E], verbose:false });
      WZ.bc=bc;
      await bc.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:260, height:140 } }, code=>{
        if(WZ && !WZ.bcBusy && WZ.steps[WZ.i].type==='barcode' && /^\d{6,14}$/.test(code)){ WZ.bcBusy=true; $('#wzVal',WZ.m).value=code; wzBarcode(code).finally(()=>{ if(WZ) WZ.bcBusy=false; }); }
      });
    }catch(e){ if(WZ) WZ.bc=null; wzDiag('Skener: '+(e.message||e)); $('#wzMsg',m).textContent='Kamera není dostupná – opiš kód ručně'; }
  } else if(type==='value'){
    await wzStopBc(); if(!WZ) return;
    rd.classList.add('hidden'); video.classList.remove('hidden'); fr.classList.remove('hidden'); $('#wzCam',m).classList.remove('scan');
    if(WZ.stream) return;
    try{
      const st=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} }, audio:false });
      if(!WZ){ st.getTracks().forEach(t=>t.stop()); return; }
      WZ.stream=st; video.srcObject=st; await video.play().catch(()=>{});
    }catch(e){ wzDiag('Kamera: '+(e.message||e)); $('#wzMsg',m).textContent='Kamera není dostupná – zadej hodnotu ručně'; }
  } else {
    await wzStopBc(); wzStopOwn();
  }
}

async function wzBarcode(code){
  WZ.vals.barcode=code;
  const own=S.foods.find(f=>f.barcode===code);
  if(own){ const then=WZ.then; toast('Tahle potravina už v databázi je'); wizardStop(); return then ? then(own) : openFoodForm(own); }
  $('#wzMsg',WZ.m).textContent='Hledám v Open Food Facts…';
  const off=await lookupOFF(code);
  if(!WZ) return;
  if(off && off.kcal!==''){ const then=WZ.then; toast('Nalezeno v Open Food Facts – zkontroluj hodnoty'); wizardStop(); return openFoodForm({ ...off, name:off.name||WZ.prefill.name||'' }, then); }
  if(off){ if(off.name && !WZ.prefill.name) WZ.prefill.name=off.name; if(off.brand) WZ.prefill.brand=off.brand; }
  toast('Kód není v databázi – načteme hodnoty z obalu');
  wzNext();
}

// Výřez rámečku z videa (video je zobrazené přes object-fit: cover)
function wzCrop(video, fr, targetH){
  const cw=video.clientWidth, ch=video.clientHeight, vw=video.videoWidth, vh=video.videoHeight;
  const sc=Math.max(cw/vw, ch/vh), ox=(vw*sc-cw)/2, oy=(vh*sc-ch)/2;
  const sx=(fr.l/100*cw+ox)/sc, sy=(fr.t/100*ch+oy)/sc, sw=(fr.w/100*cw)/sc, sh=(fr.h/100*ch)/sc;
  const k = targetH ? targetH/sh : Math.min(1, 900/sw);
  const c=document.createElement('canvas'); c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  const g=c.getContext('2d'); g.drawImage(video, sx,sy,sw,sh, 0,0,c.width,c.height);
  return c;
}
// Šedá + roztažení kontrastu (pomáhá u lesklých a světlých obalů)
function wzEnhance(c){
  const g=c.getContext('2d'), d=g.getImageData(0,0,c.width,c.height), p=d.data, hist=new Array(256).fill(0), L=new Uint8Array(p.length/4);
  for(let i=0,j=0;i<p.length;i+=4,j++){ const y=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0; L[j]=y; hist[y]++; }
  const n=L.length; let lo=0,hi=255,acc=0;
  for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>n*0.02){ lo=i; break; } }
  acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>n*0.02){ hi=i; break; } }
  const span=Math.max(1,hi-lo);
  for(let j=0;j<n;j++) L[j]=Math.max(0,Math.min(255,(L[j]-lo)*255/span));
  // Odstranění čar tabulky a ponechání jen řádku textu nejblíž středu rámečku
  const W=c.width, H=c.height, dark=new Float32Array(H);
  for(let y=0;y<H;y++){ let k=0; for(let x=0;x<W;x++) if(L[y*W+x]<110) k++; dark[y]=k/W; }
  for(let y=0;y<H;y++) if(dark[y]>0.55){ for(let x=0;x<W;x++) L[y*W+x]=255; dark[y]=0; }   // vodorovné čáry
  const ink=y=>dark[y]>0.008;
  const bands=[]; let s=-1;
  for(let y=0;y<=H;y++){ if(y<H && ink(y)){ if(s<0) s=y; } else if(s>=0){ if(y-s>=4) bands.push([s,y]); s=-1; } }
  let y0=0, y1=H;
  if(bands.length){
    const mid=H/2;
    const best=bands.reduce((a,b)=>{ const da=Math.abs((a[0]+a[1])/2-mid), db=Math.abs((b[0]+b[1])/2-mid); return db<da?b:a; });
    const pad=Math.round((best[1]-best[0])*0.35)+3; y0=Math.max(0,best[0]-pad); y1=Math.min(H,best[1]+pad);
  }
  const out=document.createElement('canvas'); out.width=W+40; out.height=(y1-y0)+40;
  const og=out.getContext('2d'); og.fillStyle='#fff'; og.fillRect(0,0,out.width,out.height);
  const od=og.getImageData(0,0,out.width,out.height), q=od.data;
  for(let y=y0;y<y1;y++) for(let x=0;x<W;x++){ const v=L[y*W+x], o=((y-y0+20)*out.width+(x+20))*4; q[o]=q[o+1]=q[o+2]=v; q[o+3]=255; }
  og.putImageData(od,0,0); return out;
}

async function wzLoop(video){
  let ocrReady=false;
  while(WZ && WZ.active){
    const st=WZ.steps[WZ.i];
    if(st.type!=='value' || !WZ.stream || !video.videoWidth || WZ.busy){ await sleep(250); continue; }
    WZ.busy=true;
    try{
      {
        if(!ocrReady){ $('#wzMsg',WZ.m).textContent='Připravuji čtení čísel (poprvé to chvíli trvá)…'; }
        const w=await getOcr();
        if(!WZ) break;
        if(!ocrReady){ ocrReady=true; $('#wzMsg',WZ.m).textContent=''; }
        const key=WZ.steps[WZ.i].key;
        await w.setParameters({ tessedit_char_whitelist: key==='kcal' ? '0123456789,.kcalJ/ ' : '0123456789,.<g ' });
        const c=wzEnhance(wzCrop(video, WZ_FRAME.value, 165));
        const { data } = await w.recognize(c);
        if(!WZ || WZ.steps[WZ.i].key!==key) { if(WZ) WZ.busy=false; continue; }
        wzDiag('Vidím: „'+String(data.text||'').trim()+'“');
        const v=parseReading(data.text, key);
        if(v!=null){
          WZ.reads.push(v); if(WZ.reads.length>5) WZ.reads.shift();
          const cnt=WZ.reads.filter(x=>x===v).length;
          const stable = cnt>=2;
          if(!WZ.edited) $('#wzVal',WZ.m).value=String(v).replace('.',',');
          $('#wzMsg',WZ.m).textContent = stable ? '✓ Přečteno – zkontroluj a potvrď' : 'Čtu… drž telefon v klidu';
        } else {
          $('#wzMsg',WZ.m).textContent = 'Nevidím číslo – posuň rámeček na hodnotu';
        }
      }
    }catch(err){
      console.error(err);
      wzDiag('Chyba: '+(err && err.message || err));
      if(WZ) $('#wzMsg',WZ.m).textContent='Čtení se nepodařilo – zadej hodnotu ručně';
      if(WZ) WZ.busy=false;
      await sleep(1500);
    }
    if(WZ) WZ.busy=false;
    await sleep(st.type==='barcode'?250:300);
  }
}

// ---------- Formulář potraviny ----------
function openFoodForm(f, then){
  const isEdit = !!f.id;
  const v = k => f[k]==null ? '' : esc(f[k]);
  const field = (k,l,extra='') => `<label class="f"><span>${l}</span><input type="number" id="f_${k}" inputmode="decimal" step="any" min="0" value="${v(k)}" ${extra}></label>`;
  const m=openModal(`${head(isEdit?'Upravit potravinu':'Nová potravina')}
    ${f.source==='off'?'<p class="small muted" style="margin-top:0">Data z Open Food Facts. Zkontroluj je podle obalu.</p>':''}
    ${f.source==='photo'&&!isEdit?'<p class="small" style="margin-top:0;color:var(--warn)">Hodnoty přečtené kamerou. Porovnej je s obalem, hlavně desetinné čárky.</p>':''}
    ${f.source==='base'?'<p class="small muted" style="margin-top:0">Základní potravina s průměrnými hodnotami. U konkrétního výrobku se údaje na obalu můžou lišit.</p>':''}
    <label class="f"><span>Název *</span><input type="text" id="f_name" value="${v('name')}" required></label>
    <div class="grid2">
      <label class="f"><span>Značka</span><input type="text" id="f_brand" value="${v('brand')}"></label>
      <label class="f"><span>Čárový kód</span><input type="text" id="f_barcode" inputmode="numeric" value="${v('barcode')}"></label>
    </div>
    <div class="small muted" style="margin:4px 0 8px">Nutriční hodnoty na 100 g (ve stejném pořadí jako na obalu)</div>
    <div class="grid2">${field('kcal','Energie (kcal) *')}<div></div></div>
    <div class="grid2">${field('fat','Tuky (g)')}${field('saturated_fat','z toho nasycené (g)')}</div>
    <div class="grid2">${field('carbs','Sacharidy (g)')}${field('sugar','z toho cukry (g)')}</div>
    <div class="grid2">${field('fiber','Vláknina (g)')}${field('protein','Bílkoviny (g)')}</div>
    <div class="grid2">${field('salt','Sůl (g)')}${field('serving_g','Porce (g)')}</div>
    <button class="btn block" id="saveFood">${isEdit?'Uložit':'Uložit potravinu'}</button>
    ${isEdit && f.created_by===S.user.id ? '<button class="btn danger block" id="delFood" style="margin-top:8px">Smazat potravinu</button>':''}
    ${isEdit && f.created_by!==S.user.id ? '<p class="small muted">Tuto potravinu přidal jiný člen rodiny, upravit ji může jen on.</p>':''}
    ${f.source==='off'?'<p class="small muted">Zdroj dat: Open Food Facts (openfoodfacts.org), licence ODbL.</p>':''}`);
  if(isEdit && f.created_by!==S.user.id) m.querySelectorAll('input,#saveFood').forEach(x=>x.disabled=true);
  $('#saveFood',m).onclick=async()=>{
    const g=id=>$('#f_'+id,m).value;
    const row={ name:g('name').trim(), brand:g('brand').trim()||null, barcode:g('barcode').trim()||null,
      kcal:num(g('kcal')), protein:num(g('protein'))||0, carbs:num(g('carbs'))||0, sugar:num(g('sugar')),
      fat:num(g('fat'))||0, saturated_fat:num(g('saturated_fat')), fiber:num(g('fiber')), salt:num(g('salt')), serving_g:num(g('serving_g'))||null };
    if(row.saturated_fat!=null && row.saturated_fat>row.fat) return toast('Nasycené tuky nemůžou být vyšší než tuky celkem');
    if(row.sugar!=null && row.sugar>row.carbs) return toast('Cukry nemůžou být vyšší než sacharidy celkem');
    if(!row.name) return toast('Vyplň název');
    if(row.kcal==null) return toast('Vyplň energii v kcal');
    if(row.barcode && !/^\d{6,14}$/.test(row.barcode)) return toast('Čárový kód musí mít 6–14 číslic');
    const macroKcal=row.protein*4+row.carbs*4+row.fat*9;
    if(row.protein+row.carbs+row.fat>100.5) return toast('Bílkoviny + sacharidy + tuky nemůžou mít víc než 100 g na 100 g');
    if(row.kcal>0 && Math.abs(macroKcal-row.kcal)/row.kcal>0.35 && !confirm(`Energie neodpovídá makrům (podle nich ~${r0(macroKcal)} kcal). Uložit i tak?`)) return;
    let res;
    if(isEdit) res=await sb.from('foods').update(row).eq('id',f.id).select().single();
    else res=await sb.from('foods').insert({ ...row, source:f.source||'manual' }).select().single();
    if(res.error){
      if(res.error.code==='23505') return toast('Potravina s tímto čárovým kódem už existuje');
      return fail(res.error,'Uložení potraviny');
    }
    await loadFoods();
    const saved=S.foods.find(x=>x.id===res.data.id)||res.data;
    if(then){ then(saved); } else { await closeModal(); renderFoods(); toast('Uloženo'); }
  };
  const del=$('#delFood',m);
  if(del) del.onclick=async()=>{
    if(!confirm('Smazat potravinu? Záznamy v jídelníčku zůstanou.')) return;
    const { error }=await sb.from('foods').delete().eq('id',f.id);
    if(error) return fail(error,'Smazání');
    await closeModal(); await loadFoods(); renderFoods();
  };
}

// ---------- Záložka Potraviny ----------
let foodsQuery='';
function renderFoods(){
  $('#title').textContent='Potraviny';
  const el=$('#tab-foods');
  el.innerHTML=`
    <div class="row" style="margin-bottom:10px">
      <input type="search" id="fq" placeholder="Hledat v ${S.foods.length} potravinách…" value="${esc(foodsQuery)}" autocomplete="off">
      <button class="btn secondary" id="fscan">Sken</button>
    </div>
    <div id="scanArea" class="hidden" style="margin-bottom:10px"><div id="reader"></div></div>
    <button class="btn block" id="fnew" style="margin-bottom:12px">+ Nová potravina</button>
    <div class="card" style="padding:4px 14px" id="flist"></div>
    <p class="small muted">Databáze potravin je společná pro celou rodinu. Jídelníček a váhu vidí každý jen svoje.</p>`;
  const draw=()=>{
    const n=norm(foodsQuery).trim(), words=n.split(/\s+/);
    const list = n ? S.foods.filter(f=>words.every(w=>norm(f.name+' '+(f.brand||'')+' '+(f.barcode||'')).includes(w))) : S.foods;
    $('#flist').innerHTML = list.length ? list.slice(0,200).map(foodLine).join('') : '<p class="empty">Žádné potraviny. Přidej první nebo naskenuj čárový kód.</p>';
    el.querySelectorAll('[data-food]').forEach(r=>r.onclick=()=>openFoodForm(S.foods.find(f=>String(f.id)===r.dataset.food)));
  };
  $('#fq').oninput=e=>{ foodsQuery=e.target.value; draw(); };
  $('#fnew').onclick=()=>chooseNewFood({}, null);
  $('#fscan').onclick=()=>startScan(el, code=>{
    const own=S.foods.find(f=>f.barcode===code);
    if(own) return openFoodForm(own);
    handleBarcode(code, async()=>{ await closeModal(); renderFoods(); toast('Uloženo'); });
  });
  draw();
}

// ---------- Záložka Účet ----------
const MPARTS = [
  ['PAŽE', [['shoulders','Ramena'],['biceps_r','Pravý biceps'],['biceps_l','Levý biceps'],['forearm_r','Pravé předloktí'],['forearm_l','Levé předloktí']]],
  ['TRUP', [['chest','Hrudník'],['waist','Pas'],['hips','Boky']]],
  ['NOHY', [['thigh_r','Pravé stehno'],['thigh_l','Levé stehno'],['calf_r','Pravé lýtko'],['calf_l','Levé lýtko']]]
];
const MLABEL = Object.fromEntries(MPARTS.flatMap(([,l])=>l));
const czDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'});
// poslední a předchozí vyplněná hodnota dané míry
function measPair(key){
  const rows=S.meas.filter(r=>r[key]!=null);
  return { cur:rows[0]?{v:Number(rows[0][key]),date:rows[0].date}:null, prev:rows[1]?{v:Number(rows[1][key]),date:rows[1].date}:null };
}
function sparkSvg(pts, color, label){
  if(pts.length<2) return '';
  const vals=pts.map(p=>p.v), mn=Math.min(...vals), mx=Math.max(...vals), span=(mx-mn)||1, W=300, H=80;
  const xy=pts.map((p,i)=>`${(i/(pts.length-1)*W).toFixed(1)},${(H-6-(p.v-mn)/span*(H-14)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${xy}"/></svg>
    <div class="row between small muted" style="font-size:11px;margin-top:4px"><span>${czDate(pts[0].date)}</span><span>min ${fmtNum(mn)} · max ${fmtNum(mx)}</span><span>${czDate(pts[pts.length-1].date)}</span></div>`;
}
function renderAccount(){
  $('#title').textContent='Účet';
  const ws=[...S.weights].reverse().slice(-60).map(w=>({date:w.date,v:Number(w.weight_kg)}));
  const last=ws[ws.length-1], first=ws[0];
  let trend='';
  if(ws.length>=2){
    const d=r1(last.v-first.v), days=Math.round((new Date(last.date)-new Date(first.date))/864e5), per=days>=14?Math.round(days/7)+' týdnů':days+' dní';
    trend=`<div class="small" style="font-weight:600;color:${d<=0?'var(--p)':'var(--kcal)'}">${sgn1(d)} kg za ${per}</div>`;
  }
  const latestDate=S.meas[0]?.date, anyPrev=S.meas[1]?.date;
  let groups='';
  for(const [g,parts] of MPARTS){
    groups+=`<div class="mgroup">${g}</div>`;
    for(const [k,l] of parts){
      const {cur,prev}=measPair(k);
      let d='<span class="d muted">–</span>';
      if(cur&&prev){ const x=r1(cur.v-prev.v); d=`<span class="d" style="color:${x>0?'var(--kcal)':x<0?'var(--p)':'var(--muted)'}">${x===0?'0,0':sgn1(x)}</span>`; }
      groups+=`<div class="mrow"><span class="n">${l}</span><span class="cz">${cur?fmt1(cur.v):'–'}</span><span class="small muted">cm</span>${d}</div>`;
    }
  }
  $('#tab-account').innerHTML=`
  <div class="card">
    <div class="row between" style="align-items:flex-start">
      <div><div class="small muted">Váha</div><div class="cz" style="font-size:30px">${last?fmt1(last.v):'–'} <span class="small muted" style="font-family:Inter,sans-serif;font-weight:500">kg</span></div>${trend}</div>
      <button class="btn outline" id="wAdd" style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;display:flex">${IC.plus}</span>Zapsat</button>
    </div>
    <div style="margin-top:10px">${sparkSvg(ws,'var(--brand)','Vývoj váhy') || '<p class="empty">Graf se ukáže po dvou zápisech váhy.</p>'}</div>
  </div>
  <div id="settingsGoal"></div>
  <div class="card">
    <div class="row between">
      <div><h2 style="margin:0">Míry těla</h2><div class="small muted">${latestDate?`Měřeno ${czDate(latestDate)}${anyPrev?' · rozdíl proti minulému měření':''}`:'Zatím žádné měření'}</div></div>
      <button class="btn" id="mAdd" style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;display:flex">${IC.plus}</span>Zapsat</button>
    </div>
    ${groups}
    ${S.meas.length>=2?'<button class="btn ghost block" id="mChart" style="margin-top:6px">Graf vývoje měr</button>':''}
  </div>
  <div id="settingsUser"></div>`;
  renderSettings();
  $('#wAdd').onclick=openWeightEntry;
  $('#mAdd').onclick=openMeasureForm;
  const mc=$('#mChart'); if(mc) mc.onclick=()=>openMeasureChart('biceps_r');
}

function openWeightEntry(){
  const m=openModal(`${head('Váha')}
    <div class="grid2" style="gap:10px">
      <label class="f"><span>Datum</span><input type="date" id="w_date" value="${todayISO()}"></label>
      <label class="f"><span>Váha (kg)</span><input type="text" id="w_val" inputmode="decimal" placeholder="${latestWeight()!=null?fmtNum(latestWeight()):'kg'}"></label>
    </div>
    <button class="btn block" id="w_save">Uložit váhu</button>
    <div class="label-caps">POSLEDNÍ ZÁPISY</div>
    <div class="card" style="padding:2px 14px">${S.weights.slice(0,10).map(x=>`<div class="list-item" style="cursor:default"><span>${new Date(x.date+'T12:00:00').toLocaleDateString('cs-CZ')}</span><span class="row"><b>${fmt1(x.weight_kg)} kg</b><button class="icon-btn" data-w="${x.id}" aria-label="Smazat zápis" style="color:var(--danger)">${IC.trash}</button></span></div>`).join('') || '<p class="empty">Zatím žádný zápis váhy.</p>'}</div>`);

  $('#w_save',m).onclick=async()=>{
    const v=num($('#w_val',m).value), d=$('#w_date',m).value;
    if(!v||!d) return toast('Zadej datum a váhu');
    if(v<20||v>400) return toast('Váha je mimo rozsah');
    const { error }=await sb.from('weight_log').upsert({ user_id:S.user.id, date:d, weight_kg:v }, { onConflict:'user_id,date' });
    if(error) return fail(error,'Váha');
    await loadWeights(); await closeModal(); renderAccount(); toast('Váha uložena');

  m.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{

    const { error }=await sb.from('weight_log').delete().eq('id',b.dataset.w);
    if(error) return fail(error,'Smazání');
    await loadWeights(); renderAccount(); openWeightEntry();
  });
}

function openMeasureForm(){
  const field=(k,l)=>{ const {cur}=measPair(k); return `<label class="f" style="margin:0"><span>${l}</span><div class="cm-in"><input type="text" inputmode="decimal" data-m="${k}" placeholder="${cur?fmt1(cur.v):''}"><span>cm</span></div></label>`; };
  const grid=(cols,list)=>`<div style="display:grid;grid-template-columns:repeat(${cols},minmax(0,1fr));gap:10px">${list.map(([k,l])=>field(k,l)).join('')}</div>`;
  const [paze,trup,nohy]=MPARTS.map(x=>x[1]);
  const m=openModal(`${head('Zapsat míry')}
    <label class="f"><span>Datum měření</span><input type="date" id="m_date" value="${todayISO()}"></label>
    <p class="small muted" style="margin-top:0">Šedá čísla jsou poslední měření. Vyplň jen to, co jsi teď měřil.</p>
    <div class="mgroup">PAŽE</div>${grid(1,paze.slice(0,1))}<div style="height:10px"></div>${grid(2,paze.slice(1))}
    <div class="mgroup" style="margin-top:8px">TRUP</div>${grid(3,trup)}
    <div class="mgroup" style="margin-top:8px">NOHY</div>${grid(2,nohy)}
    <button class="btn block" id="m_save" style="margin-top:18px">Uložit míry</button>`);
  $('#m_save',m).onclick=async()=>{
    const d=$('#m_date',m).value, row={ user_id:S.user.id, date:d };
    let n=0, bad=null;
    m.querySelectorAll('[data-m]').forEach(i=>{ const v=num(i.value); if(v!=null){ if(v<10||v>250) bad=MLABEL[i.dataset.m]; row[i.dataset.m]=v; n++; } });
    if(!d) return toast('Zadej datum');
    if(bad) return toast(`${bad}: hodnota mimo rozsah 10–250 cm`);
    if(!n) return toast('Vyplň aspoň jednu míru');
    const { error }=await sb.from('body_measurements').upsert(row, { onConflict:'user_id,date' });
    if(error) return fail(error,'Uložení měr');
    await loadMeasurements(); await closeModal(); renderAccount(); toast('Míry uloženy');
  };
}

function openMeasureChart(key){
  const pts=S.meas.filter(r=>r[key]!=null).map(r=>({date:r.date,v:Number(r[key])})).reverse();
  const m=openModal(`${head('Vývoj měr')}
    <div class="meal-pick" style="flex-wrap:wrap">${Object.entries(MLABEL).map(([k,l])=>`<button data-k="${k}" class="${k===key?'on':''}">${l}</button>`).join('')}</div>
    <div class="card"><div class="row between"><b>${MLABEL[key]}</b><span class="cz">${pts.length?fmt1(pts[pts.length-1].v)+' cm':'–'}</span></div>
      <div style="margin-top:10px">${sparkSvg(pts,'var(--brand)','Vývoj: '+MLABEL[key]) || '<p class="empty">Pro graf jsou potřeba aspoň dvě měření této míry.</p>'}</div></div>
    <div class="card" style="padding:2px 14px">${[...pts].reverse().map(p=>`<div class="list-item" style="cursor:default"><span>${new Date(p.date+'T12:00:00').toLocaleDateString('cs-CZ')}</span><b>${fmt1(p.v)} cm</b></div>`).join('') || '<p class="empty">Žádná měření.</p>'}</div>`);
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openMeasureChart(b.dataset.k));
}

// ---------- Nastavení: cíle, jméno, heslo ----------
let profMode=null;
function renderSettings(){
  const p=S.profile||{}, w=latestWeight();
  if(!profMode) profMode=p.target_mode||'manual';
  const el=$('#settingsGoal'), elU=$('#settingsUser'); if(!el||!elU) return;
  el.innerHTML=`
  <div class="card">
    <h2>Denní cíl</h2>
    <div class="seg"><button data-mode="manual" class="${profMode==='manual'?'on':''}">Zadám sám</button><button data-mode="auto" class="${profMode==='auto'?'on':''}">Dopočítat</button></div>
    <div id="modeManual" class="${profMode==='manual'?'':'hidden'}">
      <div class="grid2">
        <label class="f"><span>Energie (kcal)</span><input type="number" id="t_kcal" inputmode="numeric" value="${p.kcal_target??''}"></label>
        <label class="f"><span>Bílkoviny (g)</span><input type="number" id="t_protein" inputmode="numeric" value="${p.protein_target??''}"></label>
        <label class="f"><span>Sacharidy (g)</span><input type="number" id="t_carbs" inputmode="numeric" value="${p.carbs_target??''}"></label>
        <label class="f"><span>Tuky (g)</span><input type="number" id="t_fat" inputmode="numeric" value="${p.fat_target??''}"></label>
      </div>
      <p class="small muted" id="manualCheck"></p>
    </div>
    <div id="modeAuto" class="${profMode==='auto'?'':'hidden'}">
      <div class="grid2">
        <label class="f"><span>Pohlaví</span><select id="a_sex"><option value="">–</option><option value="m" ${p.sex==='m'?'selected':''}>Muž</option><option value="f" ${p.sex==='f'?'selected':''}>Žena</option></select></label>
        <label class="f"><span>Datum narození</span><input type="date" id="a_birth" value="${p.birth_date??''}"></label>
        <label class="f"><span>Výška (cm)</span><input type="number" id="a_height" inputmode="decimal" value="${p.height_cm??''}"></label>
        <label class="f"><span>Váha (kg)</span><input type="number" id="a_weight" inputmode="decimal" step="0.1" value="${w??''}" placeholder="poslední zápis"></label>
      </div>
      <label class="f"><span>Aktivita</span><select id="a_act">${ACTIVITY.map(([v,l])=>`<option value="${v}" ${Number(p.activity_level)===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span>Cíl</span><select id="a_goal">${GOALS.map(([v,l])=>`<option value="${v}" ${p.goal===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <div class="result" id="autoRes"></div>
    </div>
    <button class="btn block" id="saveGoal">Uložit cíl</button>
  </div>`;
  elU.innerHTML=`
  <div class="card">
    <h2>Účet</h2>
    <label class="f"><span>Jméno v aplikaci</span><input type="text" id="u_name" value="${esc(p.display_name)}"></label>
    <button class="btn secondary block" id="u_saveName" style="margin-bottom:12px">Uložit jméno</button>
    <label class="f"><span>Nové heslo</span><input type="password" id="u_pass" autocomplete="new-password" minlength="8"></label>
    <button class="btn secondary block" id="u_savePass" style="margin-bottom:12px">Změnit heslo</button>
    <button class="btn danger block" id="logout">Odhlásit se</button>
    <p class="small muted">${esc(S.user.email)}</p>
  </div>`;
  el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ profMode=b.dataset.mode; renderSettings(); });
  const readAuto=()=>({ sex:$('#a_sex').value||null, birth_date:$('#a_birth').value||null, height_cm:num($('#a_height').value),
    activity_level:Number($('#a_act').value), goal:$('#a_goal').value });
  const autoW=()=>num($('#a_weight').value);
  const drawAuto=()=>{
    const res=computeTargets(readAuto(), autoW());
    $('#autoRes').innerHTML = res
      ? `<div>Doporučený příjem: <b>${res.kcal} kcal</b></div><div class="small">Bílkoviny ${res.protein} g · Sacharidy ${res.carbs} g · Tuky ${res.fat} g</div>
         <div class="small muted" style="margin-top:4px">Bazální metabolismus ${res.bmr} kcal, celkový výdej ~${res.tdee} kcal (Mifflin–St Jeor). Je to odhad, podle vývoje váhy ho uprav.</div>`
      : '<span class="small muted">Vyplň pohlaví, datum narození, výšku a váhu.</span>';
  };
  const drawManual=()=>{
    const k=num($('#t_kcal').value), pr=num($('#t_protein').value)||0, c=num($('#t_carbs').value)||0, f=num($('#t_fat').value)||0;
    const mk=pr*4+c*4+f*9;
    $('#manualCheck').textContent = (pr||c||f) ? `Makra dávají ${r0(mk)} kcal${k?` (cíl ${k} kcal)`:''}.` : '';
  };
  if(profMode==='auto'){ el.querySelectorAll('#modeAuto input,#modeAuto select').forEach(x=>x.oninput=drawAuto); drawAuto(); }
  else { el.querySelectorAll('#modeManual input').forEach(x=>x.oninput=drawManual); drawManual(); }

  $('#saveGoal').onclick=async()=>{
    let row;
    if(profMode==='auto'){
      const a=readAuto(), wt=autoW(), res=computeTargets(a,wt);
      if(!res) return toast('Vyplň všechny údaje pro výpočet');
      row={ ...a, target_mode:'auto', kcal_target:res.kcal, protein_target:res.protein, carbs_target:res.carbs, fat_target:res.fat };
      if(wt && wt!==latestWeight()){
        const { error }=await sb.from('weight_log').upsert({ user_id:S.user.id, date:todayISO(), weight_kg:wt }, { onConflict:'user_id,date' });
        if(error) return fail(error,'Váha');
        await loadWeights();
      }
    } else {
      const k=num($('#t_kcal').value);
      if(!k) return toast('Zadej aspoň energii v kcal');
      row={ target_mode:'manual', kcal_target:r0(k), protein_target:num($('#t_protein').value)!=null?r0(num($('#t_protein').value)):null,
        carbs_target:num($('#t_carbs').value)!=null?r0(num($('#t_carbs').value)):null, fat_target:num($('#t_fat').value)!=null?r0(num($('#t_fat').value)):null };
    }
    const { data, error }=await sb.from('profiles').update({ ...row, updated_at:new Date().toISOString() }).eq('user_id',S.user.id).select().single();
    if(error) return fail(error,'Uložení cíle');
    S.profile=data; renderAccount(); toast('Cíl uložen');
  };
  $('#u_saveName').onclick=async()=>{
    const { data, error }=await sb.from('profiles').update({ display_name:$('#u_name').value.trim()||null }).eq('user_id',S.user.id).select().single();
    if(error) return fail(error,'Uložení'); S.profile=data; toast('Uloženo');
  };
  $('#u_savePass').onclick=async()=>{
    const pw=$('#u_pass').value; if(pw.length<8) return toast('Heslo musí mít aspoň 8 znaků');
    const { error }=await sb.auth.updateUser({ password:pw });
    if(error) return fail(error,'Změna hesla'); $('#u_pass').value=''; toast('Heslo změněno');
  };
  $('#logout').onclick=async()=>{ await sb.auth.signOut(); S.user=null; location.reload(); };
}

// Po návratu do aplikace (z pozadí na iPhonu) přepni na dnešek, pokud mezitím uběhla půlnoc
let lastDay=todayISO();
document.addEventListener('visibilitychange', async()=>{
  if(document.visibilityState==='visible' && S.user && todayISO()!==lastDay){
    if(S.date===lastDay) S.date=todayISO();
    lastDay=todayISO(); await loadEntries(); render(S.tab);
  }
});
</script>
</body>
</html>
